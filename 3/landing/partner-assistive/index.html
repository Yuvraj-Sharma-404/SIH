  <script>
    // Registering service worker.
    if (
      "serviceWorker" in navigator &&
      !window.location.hostname.includes("localhost")
    ) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/landing/sw.js")
          .then((registration) => {
            console.log(
              "Service Worker registered with scope:",
              registration.scope
            );
          })
          .catch((error) => {
            console.error("Service Worker registration failed:", error);
          });
      });

      navigator.serviceWorker.addEventListener("message", (event) => {
        if (event.data.action === "reload") {
          window.location.reload();
        }
      });
      console.log = function () { };
      console.warn = function () { };
      if (localStorage.getItem('userInfo') && window.location.href != 'https://web.umang.gov.in/landing/accessibility') {
        window.location.replace('https://web.umang.gov.in/web_new');
      }
    }
  </script>

 <script>
  document.addEventListener("DOMContentLoaded", function () {
    // ── Append to <html>, not <body> ──────────────────────────────────────────
    // Angular CSR route animations often apply CSS transforms to <body> or its
    // children, which turns position:fixed into position:absolute relative to
    // that transformed ancestor (per CSS spec). Appending to <html> keeps these
    // elements outside Angular's containing-block chain entirely.
    var root = document.documentElement;

    // ── Floating button ───────────────────────────────────────────────────────
    var chatbotButton = document.createElement("div");
    chatbotButton.id = "chatbot-button";
    chatbotButton.style.cssText = `
      position: fixed;
      padding-right: 20px;
      bottom: 20px;
      right: 0px;
      width: auto;
      height: 100px;
      border-radius: 50%;
      background-color: transparent;
      cursor: pointer;
      z-index: 2147483646;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    `;
    chatbotButton.innerHTML =
      '<img src="https://cdngovai.myscheme.in/64b15bf4c3a58e12cb335ec0/68108e5af2c4864461329009/logos/icon_2-icon.png"' +
      ' alt="UMANG" style="width:50px;height:50px;object-fit:contain;">';

    var askUmangLabel = document.createElement("span");
    askUmangLabel.classList.add("ask-umang");
    askUmangLabel.innerText = "Ask UMANG";
    askUmangLabel.style.cssText = `
      font-size: 14px;
      margin: 0;
      padding-left: 16px;
      color: #00599f;
      white-space: nowrap;
    `;
    chatbotButton.appendChild(askUmangLabel);
    root.appendChild(chatbotButton);

    // ── Chat window ───────────────────────────────────────────────────────────
    var chatbotWindow = document.createElement("div");
    chatbotWindow.id = "chatbot-window";
    chatbotWindow.style.cssText = `
      position: fixed;
      bottom: 0px;
      right: 0px;
      background-color: #D0E2F5;
      overflow: hidden;
      overscroll-behavior: contain;
      z-index: 2147483645;
      display: none;
    `;
    chatbotWindow.innerHTML =
      '<iframe id="chatbot-iframe" allow="clipboard-write; microphone"' +
      ' src="https://chatbot.umangapp.in/"' +
      ' style="width:100%;height:100%;border:none;overflow:hidden;"' +
      ' scrolling="no"' +
      ' sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox">' +
      '</iframe>';
    root.appendChild(chatbotWindow);

    // ── Responsive sizing ─────────────────────────────────────────────────────
    function setChatbotWindowSize() {
      if (window.innerWidth > 768) {
        chatbotWindow.style.width = "40vw";
        chatbotWindow.style.height = "75dvh";
        chatbotWindow.style.right = "0px";
      } else {
        chatbotWindow.style.width = "90vw";
        chatbotWindow.style.height = "90dvh";
        chatbotWindow.style.right = "2vw";
      }
      chatbotWindow.style.borderRadius = "16px 16px 0px 0px";
    }

    setChatbotWindowSize();
    window.addEventListener("resize", setChatbotWindowSize);

    // ── Helpers ───────────────────────────────────────────────────────────────
    function getChatbotIframe() {
      var el = document.getElementById("chatbot-iframe");
      return el ? el.contentWindow : null;
    }

    // ── Button click: open ────────────────────────────────────────────────────
    chatbotButton.addEventListener("click", function () {
      if (typeof window.triggerFromChatbot === "function") {
        window.triggerFromChatbot({ action: "openChat" });
      }
      chatbotWindow.style.display = "block";
      chatbotButton.style.display = "none";
      var iframeWin = getChatbotIframe();
      if (iframeWin) iframeWin.postMessage({ action: "handelOpeningBot" }, "*");
    });

    // ── postMessage bridge ────────────────────────────────────────────────────
    var CHATBOT_ORIGIN = "https://chatbot.umangapp.in";

    function isSafeChatbotUrl(url) {
      try {
        var parsed = new URL(url, window.location.origin);
        return parsed.protocol === "http:" || parsed.protocol === "https:";
      } catch (e) {
        return false;
      }
    }

    window.addEventListener("message", function (event) {
      // Only trust messages that actually come from the chatbot iframe, never
      // from an arbitrary window/origin that got a handle on this page.
      if (event.origin !== CHATBOT_ORIGIN || event.source !== getChatbotIframe()) {
        return;
      }
      if (!event.data || typeof event.data !== "object") return;

      if (event.data.action === "handelCloseBotModal") {
        chatbotWindow.style.display = "none";
        chatbotButton.style.display = "flex";
      }
      if (event.data.action === "openLink" && event.data.url && isSafeChatbotUrl(event.data.url)) {
        window.location.href = event.data.url;
      }
      if (event.data.action === "micPermissionDenied") {
        console.warn("Chatbot: microphone permission was denied.");
      }
    });
  });
</script>

    async function loadScriptWithIntegrity(url) {
      try {
        const response = await fetch(url);
        const scriptText = await response.text();
        const encoder = new TextEncoder();
        const data = encoder.encode(scriptText);
        const hashBuffer = await crypto.subtle.digest("SHA-384", data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashBase64 = btoa(String.fromCharCode.apply(null, hashArray));
        const scriptElement = document.createElement("script");
        scriptElement.src = url;
        scriptElement.defer = true;
        scriptElement.crossOrigin = "anonymous";
        scriptElement.integrity = `sha384-${hashBase64}`;
        document.body.appendChild(scriptElement);
      } catch (error) {
        const scriptElement = document.createElement("script");
        scriptElement.src = url;
        scriptElement.defer = true;
        scriptElement.crossOrigin = "anonymous";
        document.body.appendChild(scriptElement);
      }
    }

    const serviceAuthScriptUrl =
      "https://web.umang.gov.in/assets/resources/js/service_auth.min.js";

    loadScriptWithIntegrity(serviceAuthScriptUrl);
  </script>
